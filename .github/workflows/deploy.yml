name: Build & Deploy

# Builds the static site with build.py and deploys it to GitHub Pages using the
# official GitHub Actions path (upload-pages-artifact + deploy-pages).
#
# ONE-TIME SETUP (required): repo Settings -> Pages -> Build and deployment ->
#   Source -> "GitHub Actions".
# This is the single, canonical deploy path — it replaces the old gh-pages
# branch push, so GitHub's automatic "pages build and deployment" no longer runs
# and there is no deploy conflict. The gh-pages branch can be deleted.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static site
        run: python build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
