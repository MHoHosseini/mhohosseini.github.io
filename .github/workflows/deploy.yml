name: Build & Deploy

# Builds the static site with build.py and publishes dist/ to the gh-pages
# branch, which GitHub Pages serves. No repo settings change is required if
# Pages is already set to "Deploy from a branch → gh-pages".
#
# Prefer GitHub's native Pages deployment instead? See the commented job at the
# bottom of this file and set Pages → Source → "GitHub Actions" in repo settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static site
        run: python build.py

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true

