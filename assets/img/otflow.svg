<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500">
      <stop offset="0" stop-color="#070b17"/><stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="path" x1="120" y1="0" x2="680" y2="0">
      <stop offset="0" stop-color="#a689fb" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#4c8dff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38e1d6" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="src" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a689fb" stop-opacity="0.35"/><stop offset="1" stop-color="#a689fb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="150" cy="250" r="120" fill="url(#src)"/>

  <!-- straight OT transport paths noise (left) -> data (right) -->
  <g stroke="url(#path)" stroke-width="1.4">
    <line x1="150" y1="120" x2="640" y2="160"/>
    <line x1="150" y1="170" x2="660" y2="120"/>
    <line x1="150" y1="205" x2="650" y2="235"/>
    <line x1="150" y1="240" x2="655" y2="210"/>
    <line x1="150" y1="275" x2="648" y2="300"/>
    <line x1="150" y1="300" x2="660" y2="285"/>
    <line x1="150" y1="330" x2="645" y2="360"/>
    <line x1="150" y1="360" x2="650" y2="335"/>
    <line x1="150" y1="150" x2="655" y2="380"/>
    <line x1="150" y1="385" x2="660" y2="150"/>
  </g>

  <!-- noise samples (violet) -->
  <g fill="#a689fb">
    <circle cx="150" cy="120" r="3"/><circle cx="150" cy="150" r="3"/><circle cx="150" cy="170" r="3"/>
    <circle cx="150" cy="205" r="3"/><circle cx="150" cy="240" r="3"/><circle cx="150" cy="275" r="3"/>
    <circle cx="150" cy="300" r="3"/><circle cx="150" cy="330" r="3"/><circle cx="150" cy="360" r="3"/>
    <circle cx="150" cy="385" r="3"/>
  </g>
  <!-- data samples (cyan, structured cluster) -->
  <g fill="#38e1d6">
    <circle cx="640" cy="160" r="3.4"/><circle cx="660" cy="120" r="3.4"/><circle cx="650" cy="235" r="3.4"/>
    <circle cx="655" cy="210" r="3.4"/><circle cx="648" cy="300" r="3.4"/><circle cx="660" cy="285" r="3.4"/>
    <circle cx="645" cy="360" r="3.4"/><circle cx="650" cy="335" r="3.4"/><circle cx="655" cy="380" r="3.4"/>
    <circle cx="660" cy="150" r="3.4"/>
  </g>

  <text x="150" y="430" fill="#8ea0c4" font-family="monospace" font-size="18" text-anchor="middle">x₀ ~ 𝒩(0, I)</text>
  <text x="650" y="430" fill="#8ea0c4" font-family="monospace" font-size="18" text-anchor="middle">x₁ ~ data</text>
  <text x="400" y="70" fill="#e9edfb" font-family="monospace" font-size="19" text-anchor="middle">vθ(xₜ, t) ≈ x₁ − x₀</text>
  <text x="400" y="466" fill="#64749b" font-family="monospace" font-size="15" text-anchor="middle">straight optimal-transport paths · 4 Euler steps</text>
</svg>
